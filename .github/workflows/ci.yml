name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - frontend
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          if [ "${{ matrix.service }}" = "cartservice" ]; then
            docker build \
              -f ./src/cartservice/src/Dockerfile \
              -t ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }} \
              ./src/cartservice
          else
            docker build \
              -t ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }} \
              ./src/${{ matrix.service }}
          fi

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Push image
        run: |
          docker push \
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
