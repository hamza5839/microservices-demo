name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          if [ "${{ matrix.service }}" = "cartservice" ]; then
            docker build \
              -f ./src/cartservice/src/Dockerfile \
              -t ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }} \
              ./src/cartservice/src
          else
            docker build \
              -t ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }} \
              ./src/${{ matrix.service }}
          fi

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Push image
        run: |
          docker push \
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

  update-gitops:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: hamza5839/microservices-demo-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tags
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_PREFIX: ghcr.io/hamza5839/microservices-demo
        run: |
          set -e

          services=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for service in "${services[@]}"; do
            file="kubernetes-manifests/${service}.yaml"

            sed -i \
              -E "s#(${IMAGE_PREFIX}/${service}:)[^[:space:]]+#\1${IMAGE_TAG}#" \
              "$file"
          done

      - name: Commit and push GitOps change
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes-manifests/

          if git diff --cached --quiet; then
            echo "No GitOps image changes detected."
            exit 0
          fi

          git commit -m "update images to ${IMAGE_TAG}"
          git push
