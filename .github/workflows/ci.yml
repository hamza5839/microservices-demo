name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build currencyservice
        run: docker build -t currencyservice-ci-test ./src/currencyservice

      - name: Build paymentservice
        run: docker build -t paymentservice-ci-test ./src/paymentservice

      - name: Scan currencyservice image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: currencyservice-ci-test:latest
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Scan paymentservice image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: paymentservice-ci-test:latest
          severity: CRITICAL,HIGH
          exit-code: '1'
