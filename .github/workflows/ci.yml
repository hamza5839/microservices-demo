name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build currencyservice
        run: docker build -t ghcr.io/${{ github.repository }}/currencyservice:${{ github.sha }} ./src/currencyservice

      - name: Build paymentservice
        run: docker build -t ghcr.io/${{ github.repository }}/paymentservice:${{ github.sha }} ./src/paymentservice

      - name: Scan currencyservice image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/currencyservice:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan paymentservice image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/paymentservice:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Push currencyservice
        run: docker push ghcr.io/${{ github.repository }}/currencyservice:${{ github.sha }}

      - name: Push paymentservice
        run: docker push ghcr.io/${{ github.repository }}/paymentservice:${{ github.sha }}
